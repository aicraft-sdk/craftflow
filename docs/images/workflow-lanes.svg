<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
<title id="t">How work flows through craftflow</title>
<desc id="d">The router classifies a request into PLAN, BUILD, DEBUG or REVIEW and dispatches an agent chain for each, ending in memory finalization.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="1200" height="700" rx="16" fill="#020617" stroke="#1e293b"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<text x="30" y="44" font-size="20" font-weight="700" fill="#ffffff">How work flows through craftflow</text>
<rect x="30" y="68" width="1140" height="56" rx="12" fill="#0c2234" stroke="#22d3ee" stroke-width="1.5"/>
<text x="600" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#67e8f9">you  →  craftflow-router</text>
<text x="600" y="112" text-anchor="middle" font-size="12.5" fill="#94a3b8">classifies intent · mints a workflow id · isolates BUILD in a git worktree · dispatches the agent chain</text>
<rect x="30" y="150" width="1140" height="96" rx="12" fill="#271955" fill-opacity="0.45" stroke="#a78bfa" stroke-opacity="0.55"/>
<text x="48" y="190" font-size="18" font-weight="700" fill="#c4b5fd">PLAN</text>
<text x="48" y="212" font-size="11" fill="#94a3b8">plan, design, spec</text>
<rect x="200" y="176" width="170" height="44" rx="9" fill="#0b1224" stroke="#a78bfa"/>
<text x="285.0" y="203" text-anchor="middle" font-size="12" fill="#e2e8f0">brainstorming</text>
<rect x="410" y="176" width="170" height="44" rx="9" fill="#0b1224" stroke="#a78bfa"/>
<text x="495.0" y="203" text-anchor="middle" font-size="12" fill="#e2e8f0">planner</text>
<path d="M372 198H408" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="620" y="176" width="170" height="44" rx="9" fill="#0b1224" stroke="#a78bfa"/>
<text x="705.0" y="203" text-anchor="middle" font-size="12" fill="#e2e8f0">plan-gap-reviewer</text>
<path d="M582 198H618" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="1030" y="176" width="120" height="44" rx="9" fill="#172032" stroke="#64748b"/>
<text x="1090.0" y="203" text-anchor="middle" font-size="12" fill="#e2e8f0">memory</text>
<path d="M792 198H1028" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="705.0" y="238" text-anchor="middle" font-size="10.5" fill="#c4b5fd" fill-opacity="0.85">bounded fresh review loop</text>
<rect x="30" y="260" width="1140" height="96" rx="12" fill="#0b2d31" fill-opacity="0.45" stroke="#34d399" stroke-opacity="0.55"/>
<text x="48" y="300" font-size="18" font-weight="700" fill="#6ee7b7">BUILD</text>
<text x="48" y="322" font-size="11" fill="#94a3b8">everything else</text>
<rect x="200" y="286" width="170" height="44" rx="9" fill="#0b1224" stroke="#34d399"/>
<text x="285.0" y="313" text-anchor="middle" font-size="12" fill="#e2e8f0">component-builder</text>
<rect x="410" y="268" width="170" height="32" rx="9" fill="#0b1224" stroke="#34d399"/>
<text x="495.0" y="289" text-anchor="middle" font-size="12" fill="#e2e8f0">code-reviewer</text>
<rect x="410" y="304" width="170" height="32" rx="9" fill="#0b1224" stroke="#34d399"/>
<text x="495.0" y="325" text-anchor="middle" font-size="12" fill="#e2e8f0">silent-failure-hunter</text>
<path d="M372 308H408" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="620" y="286" width="170" height="44" rx="9" fill="#0b1224" stroke="#34d399"/>
<text x="705.0" y="313" text-anchor="middle" font-size="12" fill="#e2e8f0">integration-verifier</text>
<path d="M582 308H618" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="830" y="286" width="170" height="44" rx="9" fill="#0b1224" stroke="#34d399"/>
<text x="915.0" y="313" text-anchor="middle" font-size="12" fill="#e2e8f0">doc-syncer</text>
<path d="M792 308H828" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="1030" y="286" width="120" height="44" rx="9" fill="#172032" stroke="#64748b"/>
<text x="1090.0" y="313" text-anchor="middle" font-size="12" fill="#e2e8f0">memory</text>
<path d="M1002 308H1028" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="495.0" y="348" text-anchor="middle" font-size="10.5" fill="#6ee7b7" fill-opacity="0.85">run in parallel</text>
<rect x="30" y="370" width="1140" height="96" rx="12" fill="#3f152f" fill-opacity="0.45" stroke="#fb7185" stroke-opacity="0.55"/>
<text x="48" y="410" font-size="18" font-weight="700" fill="#fda4af">DEBUG</text>
<text x="48" y="432" font-size="11" fill="#94a3b8">error, bug, fix</text>
<rect x="200" y="396" width="170" height="44" rx="9" fill="#0b1224" stroke="#fb7185"/>
<text x="285.0" y="423" text-anchor="middle" font-size="12" fill="#e2e8f0">bug-investigator</text>
<rect x="410" y="396" width="170" height="44" rx="9" fill="#0b1224" stroke="#fb7185"/>
<text x="495.0" y="423" text-anchor="middle" font-size="12" fill="#e2e8f0">code-reviewer</text>
<path d="M372 418H408" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="620" y="396" width="170" height="44" rx="9" fill="#0b1224" stroke="#fb7185"/>
<text x="705.0" y="423" text-anchor="middle" font-size="12" fill="#e2e8f0">integration-verifier</text>
<path d="M582 418H618" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="830" y="396" width="170" height="44" rx="9" fill="#0b1224" stroke="#fb7185"/>
<text x="915.0" y="423" text-anchor="middle" font-size="12" fill="#e2e8f0">doubt-verifier</text>
<path d="M792 418H828" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="1030" y="396" width="120" height="44" rx="9" fill="#172032" stroke="#64748b"/>
<text x="1090.0" y="423" text-anchor="middle" font-size="12" fill="#e2e8f0">memory</text>
<path d="M1002 418H1028" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="915.0" y="458" text-anchor="middle" font-size="10.5" fill="#fda4af" fill-opacity="0.85">fix-verify</text>
<rect x="30" y="480" width="1140" height="96" rx="12" fill="#2e2022" fill-opacity="0.45" stroke="#fbbf24" stroke-opacity="0.55"/>
<text x="48" y="520" font-size="18" font-weight="700" fill="#fde68a">REVIEW</text>
<text x="48" y="542" font-size="11" fill="#94a3b8">review, audit</text>
<rect x="200" y="506" width="170" height="44" rx="9" fill="#0b1224" stroke="#fbbf24"/>
<text x="285.0" y="533" text-anchor="middle" font-size="12" fill="#e2e8f0">code-reviewer</text>
<rect x="1030" y="506" width="120" height="44" rx="9" fill="#172032" stroke="#64748b"/>
<text x="1090.0" y="533" text-anchor="middle" font-size="12" fill="#e2e8f0">memory</text>
<path d="M372 528H1028" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="285.0" y="568" text-anchor="middle" font-size="10.5" fill="#fde68a" fill-opacity="0.85">read-only, advisory</text>
<text x="30" y="604" font-size="12.5" fill="#94a3b8"><tspan fill="#67e8f9" font-weight="700">Fast path</tspan>  BUILD with no risk keywords runs  builder → verifier → memory;  risk keywords (auth, schema, payment, secrets …) run the full chain.</text>
<text x="30" y="630" font-size="12.5" fill="#94a3b8"><tspan fill="#67e8f9" font-weight="700">Gates</tspan>  plan trust · phase exit · failure stop · memory sync.  A failing verifier opens a remediation loop, capped at 3 cycles before a human checkpoint.</text>
<text x="30" y="656" font-size="12.5" fill="#94a3b8"><tspan fill="#67e8f9" font-weight="700">State</tspan>  .craftflow/state/ (project/ + workflows/&lt;id&gt;/) is shared by Claude Code and Cursor;  hooks guard writes and protect memory.</text>
<text x="30" y="682" font-size="12.5" fill="#64748b">Memory finalization runs inline in the router, never as a sub-agent.</text>
</g></svg>
